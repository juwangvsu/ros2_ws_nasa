laserscan_multi_merger:
  ros__parameters:
    use_sim_time: true
    allow_scan_delay: true
    destination_frame: baal/base
    scan_destination_topic: /scan3
    laserscan_topics: "/scan /scan2"

    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.001
    scan_time: 0.033
    range_min: 0.05
    range_max: 30.0

    min_height: -1.0
    max_height: 1.0
    use_inf: false
