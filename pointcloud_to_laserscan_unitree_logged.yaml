pointcloud_to_laserscan_logged:
  ros__parameters:
    use_sim_time: true
    input_topic: /unilidar/cloud
    output_topic: /scan
    target_frame: baal/base
    transform_tolerance: 0.1
    min_height: 0.1
    max_height: 2.0
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0047
    range_min: 1.0
    range_max: 8.0
    queue_size: 10
    scan_time: 0.1
    use_inf: true
    use_walltime: true
    dbg: true
    inf_epsilon: 1.0
    output_qos: reliable
